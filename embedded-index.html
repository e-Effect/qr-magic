<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#101010" />
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <link rel="mask-icon" href="/mask-icon.svg" color="#d7b56d" />
  <link rel="manifest" href="/site.webmanifest" />
  <title>Private Console</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, "SF Pro Text", "SF Pro Display", "Hiragino Sans", "Yu Gothic UI", system-ui, sans-serif;
      color: #f7f4ee;
      background: #0f100f;
      --bg: #0f100f;
      --surface: #141514;
      --surface-2: #1b1c1a;
      --separator: rgba(247, 244, 238, .12);
      --separator-strong: rgba(247, 244, 238, .2);
      --text: #f7f4ee;
      --muted: #a7aaa3;
      --secondary: #d4d8cf;
      --primary: #d7b56d;
      --primary-ink: #18130a;
      --accent: #54b7a1;
      --danger: #e55f57;
      --nav-h: 4.35rem;
    }
    * { box-sizing: border-box; }
    html { min-height: 100%; background: var(--bg); }
    body {
      margin: 0;
      width: 100%;
      min-height: 100vh;
      padding: var(--nav-h) 0 6rem;
      background: var(--bg);
    }
    h1 { font-size: 1.08rem; line-height: 1.15; margin: 0; letter-spacing: 0; font-weight: 750; }
    h2 { font-size: 0.76rem; margin: 0 0 0.45rem; color: var(--muted); letter-spacing: 0; font-weight: 720; text-transform: uppercase; }
    h3 { font-size: 0.96rem; margin: 0; font-weight: 720; }
    input[type="text"], input[type="password"], textarea, select {
      width: 100%;
      min-height: 2.9rem;
      padding: 0.62rem 0;
      font-size: 1rem;
      border: 0;
      border-radius: 0;
      background: transparent;
      color: var(--text);
      outline: none;
    }
    input[type="text"]:focus, input[type="password"]:focus, textarea:focus, select:focus, input[type="number"]:focus {
      outline: none;
    }
    input[type="number"] {
      min-height: 2.65rem;
      padding: 0.5rem 0;
      font-size: 1rem;
      border: 0;
      border-bottom: 1px solid var(--separator);
      border-radius: 0;
      background: transparent;
      color: var(--text);
      outline: none;
    }
    select { appearance: none; }
    textarea {
      min-height: 7.4rem;
      resize: vertical;
      padding: 0.7rem 0;
      border-top: 1px solid var(--separator);
      border-bottom: 1px solid var(--separator);
      font-size: 0.84rem;
      line-height: 1.45;
    }
    button {
      cursor: pointer;
      border: 1px solid transparent;
      border-radius: 999px;
      min-height: 2.45rem;
      padding: 0.56rem 0.9rem;
      font-size: 0.95rem;
      font-weight: 720;
      letter-spacing: 0;
      transition: border-color .12s ease, background .12s ease, opacity .12s ease;
    }
    button:disabled { opacity: 0.52; cursor: not-allowed; }
    .btn-primary { background: var(--primary); color: var(--primary-ink); border-color: rgba(255,255,255,.08); }
    .btn-secondary { background: rgba(247,244,238,.08); color: var(--text); border-color: var(--separator); }
    .btn-danger { background: rgba(229,95,87,.18); color: #ffd7d3; border-color: rgba(229,95,87,.38); }
    .panel {
      background: var(--surface);
      padding: 1rem max(1rem, env(safe-area-inset-left)) 1.05rem max(1rem, env(safe-area-inset-right));
      border-top: 1px solid var(--separator);
      border-bottom: 1px solid var(--separator);
      margin-top: 0.7rem;
    }
    .muted { color: var(--muted); font-size: 0.85rem; word-break: break-all; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 0.55rem; margin-top: 0.75rem; align-items: center; }
    .brandHeader {
      position: fixed;
      inset: 0 0 auto 0;
      z-index: 70;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      min-height: var(--nav-h);
      padding: calc(0.55rem + env(safe-area-inset-top)) max(1rem, env(safe-area-inset-right)) 0.55rem max(1rem, env(safe-area-inset-left));
      background: rgba(15,16,15,.92);
      border-bottom: 1px solid var(--separator);
      backdrop-filter: blur(18px);
    }
    .brandIdentity {
      display: grid;
      grid-template-columns: 2.15rem minmax(0, 1fr);
      grid-template-rows: auto auto;
      column-gap: 0.7rem;
      align-items: center;
      min-width: 0;
    }
    .brandMark {
      display: inline-grid;
      place-items: center;
      width: 2.15rem;
      height: 2.15rem;
      grid-row: 1 / span 2;
      border-radius: 8px;
      background: #101010;
      overflow: hidden;
    }
    .brandMark img {
      width: 100%;
      height: 100%;
      display: block;
    }
    .brandKicker { color: var(--primary); font-size: 0.66rem; font-weight: 800; margin: 0 0 0.08rem; letter-spacing: 0; }
    .versionPill {
      flex: 0 0 auto;
      border: 1px solid var(--separator);
      background: rgba(247,244,238,.06);
      border-radius: 999px;
      padding: 0.3rem 0.55rem;
      font-size: 0.7rem;
      color: var(--secondary);
      margin: 0;
    }
    .navActions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 0.5rem;
      flex: 0 0 auto;
    }
    .settingsFab {
      display: none;
      align-items: center;
      gap: 0.35rem;
      min-height: 2.25rem;
      padding: 0.46rem 0.72rem;
      font-size: 0.82rem;
      font-weight: 760;
      border-radius: 999px;
      background: rgba(247,244,238,.09);
      border: 1px solid var(--separator-strong);
      color: var(--text);
    }
    .settingsFab.settingsFab--visible { display: inline-flex; }
    .settingsBackdrop {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 90;
      background: rgba(0,0,0,.56);
      backdrop-filter: blur(2px);
    }
    .settingsBackdrop.settingsBackdrop--open { display: block; }
    .settingsDrawer {
      display: none;
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      width: min(100vw, 27rem);
      z-index: 100;
      background: var(--bg);
      border-left: 1px solid var(--separator);
      flex-direction: column;
      overflow: hidden;
    }
    .settingsDrawer.settingsDrawer--open { display: flex; }
    .settingsDrawerHead {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      min-height: var(--nav-h);
      padding: calc(0.55rem + env(safe-area-inset-top)) max(1rem, env(safe-area-inset-right)) 0.55rem max(1rem, env(safe-area-inset-left));
      border-bottom: 1px solid var(--separator);
      flex-shrink: 0;
      background: rgba(15,16,15,.94);
      backdrop-filter: blur(18px);
    }
    .settingsDrawerHead h2 { font-size: 0.95rem; margin: 0; }
    .settingsDrawerBody { padding: 0.7rem 0 6rem; overflow: auto; flex: 1; }
    .settingsDrawerBody textarea { font-size: 0.72rem; font-family: ui-monospace, monospace; min-height: 9rem; }
    .settingsSection { border-top: 1px solid var(--separator); border-bottom: 1px solid var(--separator); background: var(--surface); margin-bottom: 0.7rem; overflow: hidden; }
    .settingsSection summary {
      cursor: pointer;
      list-style: none;
      min-height: 3.3rem;
      padding: 0.85rem max(1rem, env(safe-area-inset-right)) 0.85rem max(1rem, env(safe-area-inset-left));
      font-weight: 700;
      display: flex;
      justify-content: space-between;
      gap: 0.75rem;
      align-items: center;
    }
    .settingsSection summary::-webkit-details-marker { display: none; }
    .settingsSection summary::after { content: "›"; color: var(--muted); font-size: 1.25rem; font-weight: 500; line-height: 1; white-space: nowrap; }
    .settingsSection[open] summary { border-bottom: 1px solid var(--separator); background: rgba(247,244,238,.035); }
    .settingsSection[open] summary::after { content: "⌄"; }
    .settingsSectionBody { padding: 0.85rem max(1rem, env(safe-area-inset-right)) 1rem max(1rem, env(safe-area-inset-left)); }
    .qrStateList { display: grid; gap: 0.4rem; max-height: 18rem; overflow: auto; margin-top: 0.55rem; }
    .qrStateRow { border-bottom: 1px solid var(--separator); padding: 0.65rem 0; background: transparent; }
    .qrStateTop { display: flex; justify-content: space-between; gap: 0.5rem; align-items: center; }
    .badge { display: inline-flex; align-items: center; border-radius: 999px; padding: 0.18rem 0.5rem; font-size: 0.72rem; font-weight: 800; background: rgba(247,244,238,.09); color: var(--secondary); white-space: nowrap; }
    .badge--fixed { background: rgba(84,183,161,.18); color: #91e6d3; }
    .badge--hit { background: rgba(215,181,109,.18); color: #f2d68e; }
    #app { display: grid; gap: 0; }
    #keyword { font-size: 1.55rem; font-weight: 780; padding: 0.6rem 0; }
    .injectUrlPanel { margin-top: 0; background: var(--surface-2); }
    .copyRow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0.75rem; align-items: center; border-top: 1px solid var(--separator); }
    .copyRow input { font-size: 0.92rem; font-weight: 720; }
    .copyRow button { white-space: nowrap; }
    #toast {
      border: 1px solid var(--separator-strong);
    }
    #gate { margin-top: 0; }
    #gate .toolbar, #app .toolbar { justify-content: flex-start; }
    #templateSelect {
      border-top: 1px solid var(--separator);
      color: var(--text);
      font-weight: 720;
    }
    #modeLine { margin-top: 0.55rem; }
    .modePanel .toolbar {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0;
      border: 1px solid var(--separator);
      border-radius: 10px;
      background: var(--surface-2);
      overflow: hidden;
    }
    #btnModeRecycle, #btnModeFrozen {
      min-width: 0;
      border-radius: 0;
      border: 0;
      background: transparent;
      color: var(--secondary);
    }
    #btnModeFrozen { border-left: 1px solid var(--separator); }
    #btnModeRecycle.btn-primary {
      background: var(--primary);
      color: var(--primary-ink);
    }
    #btnModeFrozen.btn-danger {
      background: rgba(229,95,87,.2);
      color: #ffd7d3;
    }
    @media (max-width: 430px) {
      .versionPill { display: none; }
    }
    @media (min-width: 760px) {
      body { padding-bottom: 7rem; }
      .panel {
        display: grid;
        grid-template-columns: minmax(11rem, 18rem) minmax(0, 1fr);
        column-gap: 1.6rem;
        align-items: start;
      }
      .panel h2 {
        grid-column: 1;
        padding-top: 0.18rem;
      }
      .panel > :not(h2) {
        grid-column: 2;
      }
      #app .panel {
        margin-top: 0;
      }
    }
  </style>
</head>
<body>
  <div class="settingsBackdrop" id="settingsBackdrop" aria-hidden="true"></div>
  <div class="settingsDrawer" id="settingsDrawer" role="dialog" aria-modal="true" aria-labelledby="settingsDrawerTitle">
    <div class="settingsDrawerHead">
      <h2 id="settingsDrawerTitle">設定</h2>
      <button type="button" class="btn-secondary" id="btnCloseSettings" style="padding:0.4rem 0.65rem;font-size:0.82rem">閉じる</button>
    </div>
    <div class="settingsDrawerBody">
      <details class="settingsSection" id="settingsIssueSection">
        <summary>名刺用URLの発行</summary>
        <div class="settingsSectionBody">
          <p id="ticketStatus" class="muted" style="margin-top:0"></p>
          <label class="muted">枚数</label>
          <input type="number" id="ticketCount" value="10" min="1" max="5000" style="width:6rem;margin-left:.35rem" />
          <div class="toolbar">
            <button type="button" class="btn-primary" id="btnIssueTickets">発行</button>
            <button type="button" class="btn-danger" id="btnClearTickets">全削除</button>
          </div>
          <label class="muted" style="display:block;margin-top:0.65rem">発行されたURL</label>
          <textarea id="ticketUrls" readonly rows="8"></textarea>
        </div>
      </details>

      <details class="settingsSection" id="settingsUrlSection">
        <summary>有効URL一覧</summary>
        <div class="settingsSectionBody">
          <p id="settingsUrlMeta" class="muted" style="margin:0 0 0.5rem;font-size:0.8rem"></p>
          <div class="toolbar" style="margin-top:0;margin-bottom:0.5rem">
            <button type="button" class="btn-secondary" id="btnRefreshUrlList" style="font-size:0.85rem;padding:0.45rem 0.75rem">更新</button>
          </div>
          <textarea id="settingsUrlList" readonly rows="8"></textarea>
        </div>
      </details>

      <details class="settingsSection" id="settingsQrStateSection">
        <summary>QRごとの状態</summary>
        <div class="settingsSectionBody">
          <p id="qrStateSummary" class="muted" style="margin-top:0"></p>
          <div class="toolbar">
            <button type="button" class="btn-secondary" id="btnRefreshQrState">更新</button>
          </div>
          <div id="qrStateList" class="qrStateList"></div>
        </div>
      </details>

      <details class="settingsSection" id="settingsHistorySection">
        <summary>アクセス履歴</summary>
        <div class="settingsSectionBody">
          <p id="settingsHistoryMeta" class="muted" style="margin:0 0 0.5rem;font-size:0.8rem"></p>
          <div class="toolbar" style="margin-top:0;margin-bottom:0.5rem">
            <button type="button" class="btn-secondary" id="btnRefreshHistory" style="font-size:0.85rem;padding:0.45rem 0.75rem">更新</button>
          </div>
          <label class="muted" for="settingsHistoryList" style="font-size:0.78rem">URLごとの読取回数</label>
          <textarea id="settingsHistoryList" readonly rows="6" style="margin-top:0.35rem"></textarea>
          <label class="muted" for="settingsRecentEvents" style="display:block;margin-top:.45rem;font-size:0.78rem">直近の読取イベント</label>
          <textarea id="settingsRecentEvents" readonly rows="6" style="margin-top:0.35rem"></textarea>
        </div>
      </details>

      <details class="settingsSection">
        <summary>QR画像ZIP</summary>
        <div class="settingsSectionBody">
          <p class="muted" style="margin:0 0 0.5rem;font-size:0.8rem">発行済み名刺URLをPNG化してZIPで保存します。</p>
          <button type="button" class="btn-primary" id="btnDownloadQrZip" style="font-size:0.85rem;padding:0.45rem 0.75rem">ZIPをダウンロード</button>
        </div>
      </details>

      <details class="settingsSection">
        <summary>ひとつ戻す</summary>
        <div class="settingsSectionBody">
          <p id="undoStateMeta" class="muted" style="margin-top:0"></p>
          <button type="button" class="btn-secondary" id="btnUndoState">直前の設定に戻す</button>
        </div>
      </details>

      <details class="settingsSection" id="adminCodePanel" style="display:none">
        <summary>ログインID管理</summary>
        <div class="settingsSectionBody">
          <p id="adminCodeMeta" class="muted" style="margin:0 0 0.5rem;font-size:0.8rem"></p>
          <div class="toolbar" style="margin-top:0;margin-bottom:0.5rem">
            <input type="number" id="adminIssueCount" value="50" min="1" max="5000" style="width:7rem" />
            <button type="button" class="btn-primary" id="btnAdminIssueCodes" style="font-size:0.85rem;padding:0.45rem 0.75rem">ID発行</button>
            <button type="button" class="btn-secondary" id="btnAdminRefreshCodes" style="font-size:0.85rem;padding:0.45rem 0.75rem">更新</button>
          </div>
          <textarea id="adminCodeList" readonly rows="8"></textarea>
          <div class="toolbar">
            <input type="text" id="adminRevokeCode" placeholder="停止する8桁ID" inputmode="numeric" maxlength="8" style="width:10rem" />
            <button type="button" class="btn-danger" id="btnAdminRevokeCode" style="font-size:0.85rem;padding:0.45rem 0.75rem">ID停止</button>
          </div>
        </div>
      </details>
    </div>
  </div>

  <header class="brandHeader">
    <div class="brandIdentity">
      <div class="brandMark"><img src="/icon.svg" alt="" aria-hidden="true" /></div>
      <p class="brandKicker">PRIVATE REDIRECT CONSOLE</p>
      <h1>QR Magic</h1>
    </div>
    <div class="navActions">
      <p id="appVersionBar" class="versionPill">バージョン …</p>
      <button type="button" class="settingsFab" id="btnOpenSettings" aria-haspopup="dialog" aria-expanded="false" aria-controls="settingsDrawer">
        設定
      </button>
    </div>
  </header>

  <div class="panel injectUrlPanel">
    <h2>インジェクトモードURL</h2>
    <div class="copyRow">
      <input type="text" id="injectModeUrl" readonly value="https://search.a-line.workers.dev" aria-label="インジェクトモードURL" />
      <button type="button" class="btn-secondary" id="btnCopyInjectUrl">コピー</button>
    </div>
  </div>

  <div id="gate" class="panel">
    <h2>ログインID</h2>
    <p class="muted">8桁の数字IDを入力してください。</p>
    <input type="password" id="gateToken" placeholder="例: 12345678" autocomplete="off" />
    <div class="toolbar" style="margin-top:0.65rem">
      <button type="button" class="btn-primary" id="gateBtn">開く</button>
    </div>
  </div>

  <div id="app" style="display:none">
    <div class="panel">
      <h2>テンプレート</h2>
      <select id="templateSelect" aria-label="テンプレート" style="margin-top:0.35rem"></select>
    </div>

    <div class="panel modePanel">
      <h2>モード選択</h2>
      <div class="toolbar">
        <button type="button" class="btn-secondary" id="btnModeRecycle">リサイクル</button>
        <button type="button" class="btn-secondary" id="btnModeFrozen">永久化</button>
      </div>
      <p id="modeLine" class="muted" style="margin:0.5rem 0 0"></p>
    </div>

    <div class="panel">
      <h2>キーワード</h2>
      <input type="text" id="keyword" placeholder="例: りんご" autocomplete="off" />
      <div class="toolbar">
        <button type="button" class="btn-primary" id="saveBtn">送信</button>
        <button type="button" class="btn-secondary" id="btnPreviewKeyword">プレビュー</button>
      </div>
    </div>
  </div>

  <p id="toast" style="display:none;position:fixed;bottom:1rem;left:50%;transform:translateX(-50%);background:#181817;color:#f6f0e8;padding:.6rem 1rem;border-radius:8px;z-index:120"></p>

  <script>
    const LS = "qr_magic_session_token";
    const gate = document.getElementById("gate");
    const appEl = document.getElementById("app");

    let sessionToken = localStorage.getItem(LS) || "";
    let actor = null;
    let state = null;
    let publicBaseUrl = "";
    let qrStateRows = [];

    function toast(msg) {
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.style.display = "block";
      setTimeout(() => { t.style.display = "none"; }, 2200);
    }

    function authHeaders() {
      return { Authorization: "Bearer " + sessionToken, "Content-Type": "application/json" };
    }

    async function api(path, opt = {}) {
      const r = await fetch(path, { ...opt, headers: { ...authHeaders(), ...opt.headers } });
      if (r.status === 401) {
        localStorage.removeItem(LS);
        sessionToken = "";
        location.reload();
        throw new Error("unauthorized");
      }
      const j = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(j.message || r.statusText);
      return j;
    }

    function audienceOrigin() {
      return (publicBaseUrl && publicBaseUrl.length > 0 ? publicBaseUrl : location.origin).replace(/\/+$/, "");
    }

    function injectModeUrl() {
      return audienceOrigin();
    }

    function renderInjectModeUrl() {
      const input = document.getElementById("injectModeUrl");
      if (input) input.value = injectModeUrl();
    }

    async function copyTextFromInput(input) {
      const value = input.value;
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(value);
      } else {
        input.focus();
        input.select();
        document.execCommand("copy");
      }
    }

    function setSettingsFabVisible(on) {
      const b = document.getElementById("btnOpenSettings");
      if (!b) return;
      b.classList.toggle("settingsFab--visible", !!on);
    }

    function isSettingsDrawerOpen() {
      return document.getElementById("settingsDrawer").classList.contains("settingsDrawer--open");
    }

    function openSettingsDrawer() {
      document.getElementById("settingsBackdrop").classList.add("settingsBackdrop--open");
      document.getElementById("settingsDrawer").classList.add("settingsDrawer--open");
      document.getElementById("btnOpenSettings").setAttribute("aria-expanded", "true");
      document.getElementById("settingsBackdrop").setAttribute("aria-hidden", "false");
      renderAdminCodePanel();
      renderSettingsSummaries();
    }

    function closeSettingsDrawer() {
      document.getElementById("settingsBackdrop").classList.remove("settingsBackdrop--open");
      document.getElementById("settingsDrawer").classList.remove("settingsDrawer--open");
      document.getElementById("btnOpenSettings").setAttribute("aria-expanded", "false");
      document.getElementById("settingsBackdrop").setAttribute("aria-hidden", "true");
    }

    function isAdminActor() {
      return actor && actor.role === "admin";
    }

    function renderAdminCodePanel() {
      const panel = document.getElementById("adminCodePanel");
      panel.style.display = isAdminActor() ? "block" : "none";
    }

    function renderSettingsSummaries() {
      const total = state && state.ticketCount != null ? state.ticketCount : 0;
      document.getElementById("ticketStatus").textContent = "登録中の名刺用URL: " + total + " 本";
      const undoMeta = document.getElementById("undoStateMeta");
      if (undoMeta) undoMeta.textContent = state && state.undoAvailable ? "直前の設定へ戻せます。" : "いま戻せる設定はありません。";
      const undoBtn = document.getElementById("btnUndoState");
      if (undoBtn) undoBtn.disabled = !(state && state.undoAvailable);
    }

    async function loadActiveTicketUrlsIntoDrawer() {
      const ta = document.getElementById("settingsUrlList");
      const meta = document.getElementById("settingsUrlMeta");
      meta.textContent = "読み込み中…";
      ta.value = "";
      try {
        const d = await api("/api/tickets");
        const base = audienceOrigin();
        const total = d.ticketCount != null ? d.ticketCount : 0;
        const listed = d.listCount != null ? d.listCount : (d.paths || []).length;
        meta.textContent = "全登録 " + total + " 本 / 未固定 " + listed + " 本";
        ta.value = (d.paths || []).map((p) => base + p).join("\n");
      } catch (e) {
        meta.textContent = "";
        toast(String(e.message || e));
      }
    }

    async function loadAdminCodesIntoDrawer() {
      if (!isAdminActor()) return;
      const meta = document.getElementById("adminCodeMeta");
      const ta = document.getElementById("adminCodeList");
      meta.textContent = "読み込み中…";
      ta.value = "";
      try {
        const d = await api("/api/admin/codes");
        const rows = Array.isArray(d.codes) ? d.codes : [];
        meta.textContent = "総ID数 " + rows.length;
        ta.value = rows
          .slice()
          .reverse()
          .map((r) => `${r.id}  ${r.role === "admin" ? "管理者" : "ユーザー"}  ${r.active ? "有効" : "停止"}`)
          .join("\n");
      } catch (e) {
        meta.textContent = "";
        toast(String(e.message || e));
      }
    }

    async function issueCodesBulk() {
      const n = parseInt(document.getElementById("adminIssueCount").value, 10);
      if (!Number.isFinite(n) || n < 1 || n > 5000) return toast("発行数は1〜5000");
      try {
        const d = await api("/api/admin/codes/bulk", { method: "POST", body: JSON.stringify({ count: n }) });
        const ids = Array.isArray(d.ids) ? d.ids : [];
        toast(ids.length + "件発行しました");
        const ta = document.getElementById("adminCodeList");
        ta.value = ids.join("\n") + (ta.value ? "\n" + ta.value : "");
        loadAdminCodesIntoDrawer();
      } catch (e) {
        toast(String(e.message || e));
      }
    }

    async function revokeCodeById() {
      const id = String(document.getElementById("adminRevokeCode").value || "").trim();
      if (!/^\d{8}$/.test(id)) return toast("8桁IDを入力してください");
      if (!confirm(id + " を停止します。よろしいですか？")) return;
      try {
        await api("/api/admin/codes/revoke", { method: "POST", body: JSON.stringify({ id }) });
        toast("停止しました");
        document.getElementById("adminRevokeCode").value = "";
        loadAdminCodesIntoDrawer();
      } catch (e) {
        toast(String(e.message || e));
      }
    }

    function fmtDateTime(s) {
      if (!s) return "—";
      const d = new Date(s);
      if (Number.isNaN(d.getTime())) return s;
      return d.toLocaleString("ja-JP");
    }

    async function loadTicketHistoryIntoDrawer() {
      const meta = document.getElementById("settingsHistoryMeta");
      const sumTa = document.getElementById("settingsHistoryList");
      const evTa = document.getElementById("settingsRecentEvents");
      meta.textContent = "読み込み中…";
      sumTa.value = "";
      evTa.value = "";
      try {
        const d = await api("/api/tickets/history");
        meta.textContent = "URL " + (d.ticketCount != null ? d.ticketCount : 0) + " 本 / 合計読取 " + (d.totalHits != null ? d.totalHits : 0) + " 回";
        const rows = Array.isArray(d.tickets) ? d.tickets : [];
        sumTa.value = rows
          .map((r) => {
            const latest = r.lastHitAt ? fmtDateTime(r.lastHitAt) : "未読取";
            return `${r.path}  |  ${r.hitCount} 回  |  最終: ${latest}`;
          })
          .join("\n");
        const evs = Array.isArray(d.recentEvents) ? d.recentEvents : [];
        evTa.value = evs
          .map((e) => `${fmtDateTime(e.at)}  ${e.path}  query=${e.query || "-"}`)
          .join("\n");
      } catch (e) {
        meta.textContent = "";
        toast(String(e.message || e));
      }
    }

    async function downloadTicketQrsZip() {
      try {
        const r = await fetch("/api/tickets/qr-zip", { headers: authHeaders() });
        if (!r.ok) {
          const j = await r.json().catch(() => ({}));
          throw new Error(j.message || r.statusText || "download failed");
        }
        const blob = await r.blob();
        const a = document.createElement("a");
        const cd = r.headers.get("content-disposition") || "";
        const m = cd.match(/filename=\"?([^\";]+)\"?/i);
        a.href = URL.createObjectURL(blob);
        a.download = (m && m[1]) || "qr-tickets.zip";
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(a.href), 1000);
        toast("ZIPをダウンロードしました");
      } catch (e) {
        toast(String(e.message || e));
      }
    }

    function buildUrl(template, query) {
      const host = audienceOrigin();
      return template.replaceAll("{host}", host).replaceAll("{query}", encodeURIComponent(query));
    }

    function ensurePresets() {
      if (!state.templatePresets || !state.templatePresets.length) {
        const t = state.serviceTemplate || "https://www.google.com/search?q={query}";
        state.templatePresets = [{ label: "Google", template: t }];
        state.activeTemplateIndex = 0;
      }
    }

    function ticketKeywordMode() {
      return state && state.ticketKeywordMode === "recycle" ? "recycle" : "frozen";
    }

    function qrStateLabel(row) {
      if (row && row.queryBound) return "固定済み";
      if (row && Number(row.hitCount || 0) > 0) return "読取済み";
      return "未使用";
    }

    function renderQrState() {
      const summary = document.getElementById("qrStateSummary");
      const list = document.getElementById("qrStateList");
      if (!summary || !list) return;
      const rows = Array.isArray(qrStateRows) ? qrStateRows : [];
      const fixed = rows.filter((r) => r.queryBound).length;
      const hit = rows.filter((r) => Number(r.hitCount || 0) > 0).length;
      summary.textContent = rows.length + " 本 / 読取済み " + hit + " / 固定済み " + fixed;
      list.innerHTML = "";
      rows.slice(0, 80).forEach((r) => {
        const label = qrStateLabel(r);
        const row = document.createElement("div");
        row.className = "qrStateRow";
        const badgeClass = r.queryBound ? "badge badge--fixed" : Number(r.hitCount || 0) > 0 ? "badge badge--hit" : "badge";
        const top = document.createElement("div");
        top.className = "qrStateTop";
        const pathEl = document.createElement("strong");
        pathEl.textContent = r.path || "-";
        const badge = document.createElement("span");
        badge.className = badgeClass;
        badge.textContent = label;
        const meta = document.createElement("div");
        meta.className = "muted";
        meta.textContent = "読取 " + Number(r.hitCount || 0) + " 回 / 最終 " + fmtDateTime(r.lastHitAt) + " / " + (r.query || "-");
        top.appendChild(pathEl);
        top.appendChild(badge);
        row.appendChild(top);
        row.appendChild(meta);
        list.appendChild(row);
      });
      if (!rows.length) {
        const empty = document.createElement("div");
        empty.className = "muted";
        empty.textContent = "QRはまだありません";
        list.appendChild(empty);
      }
    }

    async function refreshQrState() {
      try {
        const d = await api("/api/tickets/history");
        qrStateRows = Array.isArray(d.tickets) ? d.tickets : [];
        renderQrState();
      } catch (e) {
        toast(String(e.message || e));
      }
    }

    function renderTicketModeUi() {
      const m = ticketKeywordMode();
      document.getElementById("btnModeRecycle").className = m === "recycle" ? "btn-primary" : "btn-secondary";
      document.getElementById("btnModeFrozen").className = m === "frozen" ? "btn-danger" : "btn-secondary";
      document.getElementById("modeLine").textContent =
        m === "frozen"
          ? "いまのモード: 永久化"
          : "いまのモード: リサイクル";
    }

    function presetsFromState() {
      ensurePresets();
      return (state.templatePresets || []).map((p) => ({
        label: String(p.label || "").trim().slice(0, 60) || "プリセット",
        template: String(p.template || "").trim(),
      }));
    }

    function renderTemplateBlock() {
      ensurePresets();
      const sel = document.getElementById("templateSelect");
      sel.innerHTML = "";
      (state.templatePresets || []).forEach((p, i) => {
        const o = document.createElement("option");
        o.value = String(i);
        o.textContent = (p.label || `プリセット ${i + 1}`).slice(0, 60);
        sel.appendChild(o);
      });
      const idx = Math.min(
        Math.max(0, parseInt(state.activeTemplateIndex, 10) || 0),
        Math.max(0, state.templatePresets.length - 1)
      );
      sel.value = String(idx);
    }

    function syncKeywordFromState(opts = {}) {
      if (opts && opts.clear) {
        document.getElementById("keyword").value = "";
        return;
      }
      const q = (state.queries && state.queries[0]) || "";
      document.getElementById("keyword").value = q;
    }

    function renderAll(opts = {}) {
      ensurePresets();
      renderTemplateBlock();
      renderInjectModeUrl();
      syncKeywordFromState({ clear: !!opts.clearKeyword });
      renderTicketModeUi();
      renderSettingsSummaries();
    }

    async function load() {
      const data = await api("/api/state");
      publicBaseUrl = typeof data.publicBaseUrl === "string" ? data.publicBaseUrl.trim() : "";
      actor = data.actor || null;
      state = data.state;
      renderAll();
    }

    async function putState(body) {
      const data = await api("/api/state", { method: "PUT", body: JSON.stringify(body) });
      state = data.state;
      return data;
    }

    async function saveKeywordAndTemplateSelection(extra) {
      const kw = document.getElementById("keyword").value.trim();
      const presets = presetsFromState();
      if (!presets.length) return toast("プリセットがありません");
      for (let i = 0; i < presets.length; i++) {
        if (!presets[i].template.includes("{query}")) {
          return toast("プリセット " + (i + 1) + " に {query} を含めてください");
        }
      }
      const payloadExtra = extra && typeof extra === "object" ? extra : {};
      await putState({
        queries: [kw],
        templatePresets: presets,
        activeTemplateIndex:
          extra && extra.activeTemplateIndex !== undefined
            ? extra.activeTemplateIndex
            : parseInt(document.getElementById("templateSelect").value, 10) || 0,
        ticketKeywordMode: ticketKeywordMode(),
        commitQuery: true,
        ...payloadExtra,
      });
    }

    async function save() {
      try {
        await saveKeywordAndTemplateSelection();
        toast("送信しました");
        renderAll();
      } catch (e) {
        toast(String(e.message || e));
      }
    }

    async function undoState() {
      try {
        const data = await api("/api/state/undo", { method: "POST", body: JSON.stringify({}) });
        state = data.state;
        toast("ひとつ戻しました");
        renderAll();
      } catch (e) {
        toast(String(e.message || e));
      }
    }

    document.getElementById("templateSelect").addEventListener("change", async (e) => {
      const idx = parseInt(e.target.value, 10);
      if (!Number.isFinite(idx) || !state) return;
      const kw = document.getElementById("keyword").value.trim();
      try {
        const presets = presetsFromState();
        if (!presets.every((p) => p.template.includes("{query}"))) {
          toast("各プリセットに {query} が必要です");
          renderAll();
          document.getElementById("keyword").value = kw;
          return;
        }
        await putState({
          templatePresets: presets,
          activeTemplateIndex: idx,
          ticketKeywordMode: ticketKeywordMode(),
          commitQuery: false,
        });
        toast("切り替えました");
        renderAll();
        document.getElementById("keyword").value = kw;
      } catch (err) {
        toast(String(err.message || err));
        renderAll();
        document.getElementById("keyword").value = kw;
      }
    });

    document.getElementById("btnPreviewKeyword").onclick = () => {
      ensurePresets();
      const idx = parseInt(document.getElementById("templateSelect").value, 10) || 0;
      const tmpl = (state.templatePresets[idx] && state.templatePresets[idx].template) || "";
      const kw = document.getElementById("keyword").value.trim();
      if (!tmpl.includes("{query}")) return toast("{query} を含めてください");
      if (!kw) return toast("キーワードが空です");
      window.open(buildUrl(tmpl, kw), "_blank");
    };

    document.getElementById("btnOpenSettings").onclick = () => {
      if (!isSettingsDrawerOpen()) openSettingsDrawer();
      else closeSettingsDrawer();
    };
    document.getElementById("btnCloseSettings").onclick = () => closeSettingsDrawer();
    document.getElementById("settingsBackdrop").onclick = () => closeSettingsDrawer();
    document.getElementById("btnRefreshUrlList").onclick = () => loadActiveTicketUrlsIntoDrawer();
    document.getElementById("btnRefreshHistory").onclick = () => loadTicketHistoryIntoDrawer();
    document.getElementById("btnDownloadQrZip").onclick = () => downloadTicketQrsZip();
    document.getElementById("btnAdminIssueCodes").onclick = () => issueCodesBulk();
    document.getElementById("btnAdminRefreshCodes").onclick = () => loadAdminCodesIntoDrawer();
    document.getElementById("btnAdminRevokeCode").onclick = () => revokeCodeById();
    document.getElementById("btnUndoState").onclick = () => undoState();
    document.getElementById("btnRefreshQrState").onclick = () => refreshQrState();

    document.getElementById("settingsUrlSection").addEventListener("toggle", (e) => {
      if (e.target.open) loadActiveTicketUrlsIntoDrawer();
    });
    document.getElementById("settingsHistorySection").addEventListener("toggle", (e) => {
      if (e.target.open) loadTicketHistoryIntoDrawer();
    });
    document.getElementById("settingsQrStateSection").addEventListener("toggle", (e) => {
      if (e.target.open) refreshQrState();
    });
    document.getElementById("adminCodePanel").addEventListener("toggle", (e) => {
      if (e.target.open) loadAdminCodesIntoDrawer();
    });

    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && isSettingsDrawerOpen()) closeSettingsDrawer();
    });

    document.getElementById("gateBtn").onclick = async () => {
      const id = document.getElementById("gateToken").value.trim();
      if (!/^\d{8}$/.test(id)) return toast("8桁のログインIDを入力してください");
      try {
        const d = await fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ id }),
        }).then((r) => r.json());
        if (!d.ok || !d.token) {
          return toast(d.message || "ログインに失敗しました");
        }
        sessionToken = d.token;
        localStorage.setItem(LS, sessionToken);
        startApp();
      } catch (e) {
        toast(String(e.message || e));
      }
    };

    document.getElementById("saveBtn").onclick = () => save();
    document.getElementById("btnCopyInjectUrl").onclick = async () => {
      try {
        await copyTextFromInput(document.getElementById("injectModeUrl"));
        toast("コピーしました");
      } catch (e) {
        toast("コピーできませんでした");
      }
    };

    async function setTicketKeywordMode(mode) {
      try {
        const data = await api("/api/state", {
          method: "PUT",
          body: JSON.stringify({ ticketKeywordMode: mode }),
        });
        state = data.state;
        document.getElementById("keyword").value = "";
        toast(mode === "frozen" ? "永久化にしました" : "リサイクルにしました");
        renderAll({ clearKeyword: true });
      } catch (e) {
        toast(String(e.message || e));
      }
    }
    document.getElementById("btnModeFrozen").onclick = () => setTicketKeywordMode("frozen");
    document.getElementById("btnModeRecycle").onclick = () => setTicketKeywordMode("recycle");

    document.getElementById("btnIssueTickets").onclick = () => {
      const n = parseInt(document.getElementById("ticketCount").value, 10);
      if (!Number.isFinite(n) || n < 1 || n > 5000) return toast("枚数は1〜5000");
      api("/api/tickets/bulk", { method: "POST", body: JSON.stringify({ count: n }) })
        .then((d) => {
          state.ticketCount = d.ticketCount;
          const base = audienceOrigin();
          const lines = (d.tickets || []).map((x) => base + x.path);
          document.getElementById("ticketUrls").value = lines.join("\n");
          toast("発行しました");
          renderAll();
          if (document.getElementById("settingsQrStateSection").open) refreshQrState();
        })
        .catch((e) => toast(String(e.message || e)));
    };
    document.getElementById("btnClearTickets").onclick = () => {
      if (!confirm("名刺用URLをすべて削除します。よろしいですか？")) return;
      api("/api/tickets/clear", { method: "POST", body: JSON.stringify({ confirm: true }) })
        .then((d) => {
          state.ticketCount = d.ticketCount;
          document.getElementById("ticketUrls").value = "";
          toast("削除しました");
          renderAll();
          if (document.getElementById("settingsQrStateSection").open) refreshQrState();
        })
        .catch((e) => toast(String(e.message || e)));
    };

    let pollTimer = null;
    function startPublicUrlPoller() {
      if (pollTimer) return;
      let n = 0;
      pollTimer = setInterval(async () => {
        n++;
        if (n > 45) {
          clearInterval(pollTimer);
          pollTimer = null;
        }
        try {
          const r = await fetch("/api/public-qr-hint");
          const d = await r.json();
          const base = (d.publicBaseUrl || "").replace(/\/+$/, "");
          if (base && state) {
            const changed = base !== publicBaseUrl;
            publicBaseUrl = base;
            if (changed) renderAll();
          }
        } catch (_) {}
      }, 2000);
    }

    async function startApp() {
      try {
        await load();
        gate.style.display = "none";
        appEl.style.display = "grid";
        setSettingsFabVisible(true);
        renderAll({ clearKeyword: true });
        startPublicUrlPoller();
      } catch (e) {
        localStorage.removeItem(LS);
        sessionToken = "";
        actor = null;
        gate.style.display = "block";
        appEl.style.display = "none";
        setSettingsFabVisible(false);
        closeSettingsDrawer();
        toast("読み込み失敗: IDを確認してください");
      }
    }

    renderInjectModeUrl();
    if (sessionToken) startApp();

    (function loadAppVersion() {
      fetch("/api/version")
        .then((r) => r.json())
        .then((d) => {
          const el = document.getElementById("appVersionBar");
          if (el && d.version) el.textContent = "バージョン " + d.version;
        })
        .catch(() => {
          const el = document.getElementById("appVersionBar");
          if (el) el.textContent = "";
        });
    })();
  </script>
</body>
</html>
